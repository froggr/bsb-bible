<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamp &amp; Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: single reading column; study surfaces slide in from the right as a sheet.
   Palette: warm ink on aged paper, lamp-gold accent, muted indigo for original-language data. */
:root{
  --paper:#f7f3ea; --paper-sunk:#efe9dc; --ink:#2b2622; --ink-soft:#6d6459;
  --rule:#ddd4c3; --gold:#a8762c; --indigo:#4a5878; --sel:#f2e2bd;
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-read:"Newsreader",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15161a; --paper-sunk:#1d1f24; --ink:#e6e0d4; --ink-soft:#9a9287;
    --rule:#2e3138; --gold:#d9a84e; --indigo:#8fa2cc; --sel:#3a3320;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15161a; --paper-sunk:#1d1f24; --ink:#e6e0d4; --ink-soft:#9a9287;
  --rule:#2e3138; --gold:#d9a84e; --indigo:#8fa2cc; --sel:#3a3320;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-read);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--rule);
  background:var(--paper);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.ref{font-family:var(--font-display);font-size:1.3rem;font-weight:600;letter-spacing:.01em;
  background:none;border:1px solid var(--rule);border-radius:7px;color:var(--ink);padding:5px 11px;cursor:pointer}
.ref:hover{border-color:var(--gold)}
.bar-sp{flex:1}
.iconbtn{font-family:var(--font-ui);font-size:.74rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:999px;padding:6px 13px;cursor:pointer}
.iconbtn:hover{border-color:var(--gold);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--paper)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- reading column ---- */
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:34rem;margin:0 auto;padding:44px 22px 42vh}
h2.sec{font-family:var(--font-display);font-size:1.05rem;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--gold);margin:2.6em 0 .9em;text-wrap:balance}
h2.sec:first-child{margin-top:0}
.psalmtitle{font-family:var(--font-read);font-style:italic;font-size:.95rem;color:var(--ink-soft);
  margin:0 0 1.5em;padding-bottom:1.1em;border-bottom:1px solid var(--rule)}
p.v{font-size:1.2rem;line-height:1.82;margin:0 0 1.15em;font-weight:300;text-wrap:pretty}
.vn{font-family:var(--font-ui);font-size:.62rem;font-weight:600;color:var(--gold);
  vertical-align:.5em;margin-right:.38em;letter-spacing:.04em;cursor:pointer;user-select:none}
.vn:hover{text-decoration:underline}
.w{cursor:pointer;transition:background .13s}
.w:hover{background:var(--sel)}
.w.lit{background:var(--sel);box-shadow:0 1px 0 var(--gold)}
p.v.reading{background:linear-gradient(90deg,var(--paper-sunk),transparent);
  box-shadow:-14px 0 0 var(--paper-sunk),inset 2px 0 0 var(--gold);border-radius:2px}
p.v.noted{border-left:2px solid var(--indigo);margin-left:-14px;padding-left:12px}

/* ---- study sheet ---- */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(27rem,100%);background:var(--paper-sunk);
  border-left:1px solid var(--rule);transform:translateX(101%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  z-index:40;display:flex;flex-direction:column;box-shadow:-18px 0 44px rgba(0,0,0,.14)}
.sheet.open{transform:none}
.sheet-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px;border-bottom:1px solid var(--rule)}
.sheet-h strong{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.sheet-h .x{margin-left:auto;background:none;border:none;color:var(--ink-soft);font-size:1.5rem;
  line-height:1;cursor:pointer;padding:0 4px}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--rule)}
.tab{font-family:var(--font-ui);font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);padding:11px 9px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.sheet-b{flex:1;overflow-y:auto;padding:18px}
.orig{font-size:1.75rem;line-height:1.5;margin:0 0 2px;color:var(--ink);direction:var(--dir,ltr)}
.translit{font-family:var(--font-mono);font-size:.84rem;color:var(--indigo);margin:0 0 14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-family:var(--font-ui);font-size:.82rem;margin:0}
.dl dt{color:var(--ink-soft);letter-spacing:.03em}
.dl dd{margin:0}
.strongs{font-family:var(--font-mono);color:var(--gold);font-weight:500}
.xr{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule);
  font-family:var(--font-ui);font-size:.88rem;cursor:pointer}
.xr:hover .xr-ref{color:var(--gold)}
.xr-ref{flex:1;font-weight:500}
.bars{display:flex;gap:1.5px;align-items:flex-end;height:13px}
.bars i{width:3px;background:var(--gold);border-radius:1px;opacity:.75}
.xr-n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);min-width:2.4em;text-align:right}
textarea{width:100%;min-height:9rem;background:var(--paper);border:1px solid var(--rule);border-radius:7px;
  color:var(--ink);font-family:var(--font-read);font-size:1rem;line-height:1.65;padding:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
.note-tools{display:flex;gap:8px;margin-top:10px;align-items:center}
/* highlight colours, tuned to stay legible on both papers */
.hl-gold{background:#f6e3ad}.hl-rose{background:#f3d3d3}
.hl-sage{background:#d6e6cf}.hl-sky{background:#d3e2f3}
.hl-gold{box-shadow:-.4px 0 0 #f6e3ad,.4px 0 0 #f6e3ad}
.hl-rose{box-shadow:-.4px 0 0 #f3d3d3,.4px 0 0 #f3d3d3}
.hl-sage{box-shadow:-.4px 0 0 #d6e6cf,.4px 0 0 #d6e6cf}
.hl-sky{box-shadow:-.4px 0 0 #d3e2f3,.4px 0 0 #d3e2f3}
.hl-gold,.hl-rose,.hl-sage,.hl-sky{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.hl-gold,.w.hl-rose,.w.hl-sage,.w.hl-sky{color:#17181c}
:root[data-theme="dark"] .w.hl-gold,:root[data-theme="dark"] .w.hl-rose,
:root[data-theme="dark"] .w.hl-sage,:root[data-theme="dark"] .w.hl-sky{color:#17181c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w.hl-gold,
:root:not([data-theme="light"]) .w.hl-rose,:root:not([data-theme="light"]) .w.hl-sage,
:root:not([data-theme="light"]) .w.hl-sky{color:#17181c}}
.w.sel-range{background:var(--sel);box-shadow:inset 0 -1px 0 var(--gold)}
.w.hasnote{border-bottom:2px solid var(--indigo)}
/* floating toolbar shown while a range is selected */
.toolbar{position:fixed;z-index:45;display:none;gap:5px;padding:7px;border-radius:11px;
  background:var(--paper);border:1px solid var(--rule);box-shadow:0 8px 26px rgba(0,0,0,.2);align-items:center}
.toolbar.open{display:flex}
.swatch{width:25px;height:25px;border-radius:50%;border:1.5px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.swatch:hover{transform:scale(1.11)}
.tb-sep{width:1px;height:21px;background:var(--rule);margin:0 2px}
.tb-btn{font-family:var(--font-ui);font-size:.72rem;font-weight:500;background:none;border:none;
  color:var(--ink);cursor:pointer;padding:5px 9px;border-radius:6px;white-space:nowrap}
.tb-btn:hover{background:var(--paper-sunk)}
.fn{font-family:var(--font-ui);font-size:.58rem;font-weight:600;color:var(--indigo);
  vertical-align:.52em;margin-left:1px;cursor:pointer;user-select:none}
.fn:hover{text-decoration:underline}
.fnote{font-family:var(--font-ui);font-size:.84rem;line-height:1.6;padding:11px 0;
  border-bottom:1px solid var(--rule);color:var(--ink)}
.fnote b{color:var(--indigo);font-weight:600;margin-right:6px}
.comm{margin:0 0 22px}
.comm h4{font-family:var(--font-ui);font-size:.68rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);margin:0 0 8px;display:flex;gap:7px;align-items:baseline}
.comm h4 span{font-weight:400;letter-spacing:.04em;color:var(--ink-soft);text-transform:none;font-size:.7rem}
.comm p{font-family:var(--font-read);font-size:.95rem;line-height:1.68;margin:0;
  font-weight:300;color:var(--ink);text-wrap:pretty}
.hl-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.hl-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:5px}
.hl-txt{flex:1;font-size:.93rem;line-height:1.5}
.hl-meta{font-family:var(--font-ui);font-size:.7rem;color:var(--ink-soft);margin-top:3px}
.hint{font-family:var(--font-ui);font-size:.74rem;color:var(--ink-soft);line-height:1.5}

/* ---- player ---- */
.player{border-top:1px solid var(--rule);background:var(--paper);padding:11px 18px;
  display:flex;align-items:center;gap:15px;flex-wrap:wrap;z-index:35}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--gold);color:var(--paper);
  font-size:1.05rem;cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.play:hover{filter:brightness(1.07)}
.pmeta{flex:1;min-width:9rem}
.pnow{font-family:var(--font-ui);font-size:.8rem;font-weight:500}
.psub{font-family:var(--font-ui);font-size:.69rem;color:var(--ink-soft);letter-spacing:.03em;margin-top:2px}
.track{height:3px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.sel{font-family:var(--font-ui);font-size:.74rem;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;padding:6px 9px;cursor:pointer}
.sel:focus{outline:none;border-color:var(--gold)}
.vlabel{font-family:var(--font-ui);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);display:block;margin-bottom:3px}
.pgroup{display:flex;flex-direction:column}

/* ---- picker ---- */
.picker{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none;place-items:center;padding:20px}
.picker.open{display:grid}
.picker-in{background:var(--paper);border-radius:12px;max-width:21rem;width:100%;overflow:hidden;
  border:1px solid var(--rule)}
.picker-in h3{font-family:var(--font-display);font-size:1.1rem;margin:0;padding:16px 18px;
  border-bottom:1px solid var(--rule);font-weight:600}
.pick{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rule);
  padding:14px 18px;cursor:pointer;font-family:var(--font-read);font-size:1.02rem;color:var(--ink)}
.pick:hover{background:var(--paper-sunk)}
.pick small{display:block;font-family:var(--font-ui);font-size:.71rem;color:var(--ink-soft);margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:600px){.col{padding:30px 18px 42vh}p.v{font-size:1.12rem}.sheet{width:100%}}
</style>
</head>
<body>
<div class="bar">
  <button class="ref" id="refbtn">Psalm 23 &#9662;</button>
  <span class="bar-sp"></span>
  <button class="iconbtn" id="btn-study" aria-pressed="false">Study</button>
  <button class="iconbtn" id="btn-theme">Theme</button>
</div>

<div class="scroll" id="scroll"><div class="col" id="col"></div></div>

<div class="player">
  <button class="play" id="play" aria-label="Play narration">&#9654;</button>
  <div class="pmeta">
    <div class="pnow" id="pnow">Psalm 23</div>
    <div class="psub" id="psub">Phonon 31M &middot; on device &middot; ready</div>
    <div class="track"><i id="prog"></i></div>

  <div class="pgroup">

    <label class="vlabel" for="bed">Bed</label>

      <option>Lo-fi: jazzhop</option><option>Lo-fi: late night</option><option>Prayer room</option>

  </div>
  <div class="pgroup">
    <label class="vlabel" for="rate">Pace</label>
    <select class="sel" id="rate">
      <option>0.9&times;</option><option selected>1.0&times;</option><option>1.15&times;</option><option>1.3&times;</option>
    </select>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <button class="swatch" data-hl="gold" style="background:#f6e3ad" title="Gold"></button>
  <button class="swatch" data-hl="rose" style="background:#f3d3d3" title="Rose"></button>
  <button class="swatch" data-hl="sage" style="background:#d6e6cf" title="Sage"></button>
  <button class="swatch" data-hl="sky" style="background:#d3e2f3" title="Sky"></button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="tb-note">Note</button>
  <button class="tb-btn" id="tb-clear">Clear</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-h"><strong id="sheet-ref">Psalm 23:1</strong>
    <button class="x" id="sheet-x" aria-label="Close">&times;</button></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="word" aria-selected="true">Word</button>
    <button class="tab" role="tab" data-t="xref" aria-selected="false">Cross-refs</button>
    <button class="tab" role="tab" data-t="fn" aria-selected="false">Notes</button>
    <button class="tab" role="tab" data-t="comm" aria-selected="false">Commentary</button>
    <button class="tab" role="tab" data-t="note" aria-selected="false">Mine</button>
  </div>
  <div class="sheet-b" id="sheet-b"></div>
</div>

<div class="picker" id="picker"><div class="picker-in">
  <h3>Go to</h3>
  <button class="pick" data-c="Psalm 23">Psalm 23<small>Hebrew &middot; 6 verses</small></button>
  <button class="pick" data-c="John 1">John 1<small>Greek &middot; verses 1&ndash;18</small></button>
  <button class="pick" data-c="Romans 8">Romans 8<small>Greek &middot; verses 26&ndash;39</small></button>
</div></div>

},{"ref":"1 John 5:4–5","votes":65},{"ref":"Revelation 21:7","votes":39},{"ref":"Revelation 12:11","votes":31}],"Romans 8:38":[{"ref":"John 10:28","votes":67},{"ref":"Romans 14:8","votes":38},{"ref":"2 Timothy 1:12","votes":31},{"ref":"1 Peter 5:8–10","votes":21},{"ref":"1 Peter 3:22","votes":19},{"ref":"Colossians 1:16","votes":18}],"Romans 8:39":[{"ref":"John 10:28–30","votes":48},{"ref":"Romans 8:35","votes":44},{"ref":"Romans 5:8","votes":31},{"ref":"Ephesians 3:18–19","votes":28},{"ref":"1 John 4:19","votes":27},{"ref":"1 John 4:9–10","votes":21}]}};
const COMM = {"t":{"0bcd7a2bd0":"PSALM 23 Psa 23:1-6 . Under a metaphor borrowed from scenes of pastoral life, with which David was familiar, he describes God's providential care in providing refreshment, guidance, protection, and abundance, and so affording grounds of confidence in His perpetual favor. 1. Christ's relation to His people is often represented by the figure of a shepherd ( Joh 10:14 ; He 13:20 ; 1Pe 2:25 ; 5:4 ), and therefore the opinion that He is the Lord here so described, and in Ge 48:15 ; Psa 80:1 ; Is 40:11 , is not without some good reason.","256cf7de47":"Plentiful provision is made for their bodies, for their souls, for the life that now is and for that which is to come. If Providence do not bestow upon us thus plentifully for our natural life, it is our own fault if it be not made up to us in spiritual blessings. 2. How confidently he counts upon the continuance of God's favours, v. 6 . He had said ( v. 1 ), I shall not want; but now he speaks more positively, more comprehensively: Surely goodness and mercy shall follow me all the days of my life. His hope rises, and his faith is strengthened, by being exercised. Observe, (1.) What he promises himself—goodness and mercy, all the streams of mercy flowing from the fountain, pardoning mercy, protecting mercy, sustaining mercy, supplying mercy. (2.) The manner of the conveyance of it: It shall follow me, as the water out of the rock followed the camp of Israel through the wilderness; it shall follow into all places and all conditions, shall be always ready. (3.) The continuance of it: It shall follow me all my life long, even to the last; for whom God loves he loves to the end. (4.) The constancy of it: All the days of my life, as duly as the day comes; it shall be new every morning ( Lam. iii. 22, 23 ) like the manna that was given to the Israelites daily. (5.) The certainty of it: Surely it shall. It is as sure as the promise of the God of truth can make it; and we know whom we have believed. (6.) Here is a prospect of the perfection of bliss in the future state. So some take the latter clause: \"Goodness and mercy having followed me all the days of my life on this earth, when that is ended I shall remove to a better world, to dwell in the house of the Lord for ever, in our Father's house above, where there are many mansions. With what I have I am pleased much; with what I hope for I am pleased more. \" All this, and heaven too! Then we serve a good Master. 3. How resolutely he determines to cleave to God and to his duty. We read the last clause as David's covenant with God: \" I will dwell in the house of the Lord for ever (as long as I live), and I will praise him while I have any being.\" We must dwell in his house as servants, that desired to have their ears bored to the door-post, to serve him for ever. If God's goodness to us be like the morning light, which shines more and more to the perfect day, let not ours to him be like the morning cloud and the early dew that passeth away. Those that would be satisfied with the fatness of God's house must keep close to the duties of it.","11117ae27d":"green pastures — or, \"pastures of tender grass,\" are mentioned, not in respect to food, but as places of cool and refreshing rest. the still waters — are, literally, \"waters of \"stillness,\" whose quiet flow invites to repose. They are contrasted with boisterous streams on the one hand, and stagnant, offensive pools on the other.","494a899294":"To restore the soul is to revive or quicken it ( Psa 19:7 ), or relieve it ( La 1:11 , 19 ). paths of righteousness — those of safety, as directed by God, and pleasing to Him. for his name's sake — or, regard for His perfections, pledged for His people's welfare.","7fe4b17eaf":"In the darkest and most trying hour God is near. the valley of the shadow of death — is a ravine overhung by high precipitous cliffs, filled with dense forests, and well calculated to inspire dread to the timid, and afford a covert to beasts of prey. While expressive of any great danger or cause of terror, it does not exclude the greatest of all, to which it is most popularly applied, and which its terms suggest. thy rod and thy staff — are symbols of a shepherd's office. By them he guides his sheep.","bfae226c12":"5-6. Another figure expresses God's provided care. a table — or, \"food,\" anointing oil — the symbol of gladness, and the overflowing cup — which represents abundance — are prepared for the child of God, who may feast in spite of his enemies, confident that this favor will ever attend him. This beautiful Psalm most admirably sets before us, in its chief figure, that of a shepherd, the gentle, kind, and sure care extended to God's people, who, as a shepherd, both rules and feeds them. The closing verse shows that the blessings mentioned are spiritual.","287d1f6864":"Fourth Gospel was the younger of the two sons of Zebedee, a fisherman on the Sea of Galilee, who resided at Bethsaida, where were born Peter and Andrew his brother, and Philip also. His mother's name was Salome, who, though not without her imperfections ( Mt 20:20-28 ), was one of those dear and honored women who accompanied the Lord on one of His preaching circuits through Galilee, ministering to His bodily wants; who followed Him to the cross, and bought sweet spices to anoint Him after His burial, but, on bringing them to the grave, on the morning of the First Day of the week, found their loving services gloriously superseded by His resurrection ere they arrived. His father, Zebedee, appears to have been in good circumstances, owning a vessel of his own and having hired servants ( Mr 1:20 ). Our Evangelist, whose occupation was that of a fisherman with his father, was beyond doubt a disciple of the Baptist, and one of the two who had the first interview with Jesus. He was called while engaged at his secular occupation ( Mt 4:21 , 22 ), and again on a memorable occasion ( Lu 5:1-11 ), and finally chosen as one of the Twelve Apostles ( Mt 10:2 ). He was the youngest of the Twelve — the \"Benjamin,\" as Da Costa calls him — and he and James his brother were named in the native tongue by Him who knew the heart, \"Boanerges,\" which the Evangelist Mark ( Mr 3:17 ) explains to mean \"Sons of thunder\"; no doubt from their natural vehemence of character. They and Peter constituted that select triumvirate of whom see on Lu 9:28 . But the highest honor bestowed on this disciple was his being admitted to the bosom place with his Lord at the table, as \"the disciple whom Jesus loved\" ( Joh 13:23 ; 20:2 ; 21:7 , 20:24 ), and to have committed to him by the dying Redeemer the care of His mother ( Joh 19:26 , 27 ). There can be no reasonable doubt that this distinction was due to a sympathy with His own spirit and mind on the part of John which the all-penetrating Eye of their common Master beheld in none of the rest; and although this was probably never seen either in his life or in his ministry by his fellow apostles, it is brought out wonderfully in his writings, which, in Christ-like spirituality, heavenliness, and love, surpass, we may freely say, all the other inspired writings. After the effusion of the Spirit on the day of Pentecost, we find him in constant but silent company with Peter, the great spokesman and actor in the infant Church until the accession of Paul. While his love to the Lord Jesus drew him spontaneously to the side of His eminent servant, and his chastened vehemence made him ready to stand courageously by him, and suffer with him, in all that his testimony to Jesus might cost him, his modest humility, as the youngest of all the apostles, made him an admiring listener and faithful supporter of his brother apostle rather than a speaker or separate actor. Ecclesiastical history is uniform in testifying that John went to Asia Minor; but it is next to certain that this could not have been till after the death both of Peter and Paul; that he resided at Ephesus, whence, as from a center, he superintended the churches of that region, paying them occasional visits; and that he long survived the other apostles. Whether the mother of Jesus died before this, or went with John to Ephesus, where she died and was buried, is not agreed. One or two anecdotes of his later days have been handed down by tradition, one at least bearing marks of reasonable probability. But it is not necessary to give them here. In the reign of Domitian (A.D. 81-96) he was banished to \"the isle that is called Patmos\" (a small rocky and then almost uninhabited island in the Ægean Sea), \"for the word of God and for the testimony of Jesus Christ\" ( Re 1:9 ). Irenæus and Eusebius say that this took place about the end of Domitian's reign. That he was thrown into a cauldron of boiling oil, and miraculously delivered, is one of those legends which, though reported by Tertullian and Jerome, is entitled to no credit. His return from exile took place during the brief but tolerant reign of Nerva; he died at Ephesus in the reign of Trajan [Eusebius, Ecclesiastical History, 3.23], at an age above ninety, according to some; according to others, one hundred; and even one hundred twenty, according to others still. The intermediate number is generally regarded as probably the nearest to the truth. As to the date of this Gospel, the arguments for its having been composed before the destruction of Jerusalem (though relied on by some superior critics) are of the slenderest nature; such as the expression in Joh 5:2 , \"there is at Jerusalem, by the sheep-gate, a pool,\" &c.; there being no allusion to Peter's martyrdom as having occurred according to the prediction in Joh 21:18 — a thing too well known to require mention. That it was composed long after the destruction of Jerusalem, and after the decease of all the other apostles, is next to certain, though the precise time cannot be determined. Probably it was before his banishment, however; and if we date it between the years 90 and 94, we shall probably be close to the truth. As to the readers for whom it was more immediately designed, that they were Gentiles we might naturally presume from the lateness of the date; but the multitude of explanations of things familiar to every Jew puts this beyond all question. No doubt was ever thrown upon the genuineness and authenticity of this Gospel till about the close of the eighteenth century; nor were these embodied in any formal attack upon it till Bretschneider, in 1820, issued his famous treatise [Probabilia], the conclusions of which he afterwards was candid enough to admit had been satisfactorily disproved. To advert to these would be as painful as unnecessary; consisting as they mostly do of assertions regarding the Discourses of our Lord recorded in this Gospel which are revolting to every spiritual mind. The Tubingen school did their best, on their peculiar mode of reasoning, to galvanize into fresh life this theory of the post-Joannean date of the Fourth Gospel; and some Unitarian critics still cling to it. But to use the striking language of Van Oosterzee regarding similar speculations on the Third Gospel, \"Behold, the feet of them that shall carry it out dead are already at the door\" ( Ac 5:9 ). Is there one mind of the least elevation of spiritual discernment that does not see in this Gospel marks of historical truth and a surpassing glory such as none of the other Gospels possess, brightly as they too attest their own verity; and who will not be ready to say that if not historically true, and true just as it stands, it never could have been by mortal man composed or conceived? Of the peculiarities of this Gospel, we note here only two. The one is its reflective character. While the others are purely narrative, the Fourth Evangelist, \"pauses, as it were, at every turn,\" as Da Costa says [Four Witnesses, p. 234], \"at one time to give a reason, at another to fix the attention, to deduce consequences, or make applications, or to give utterance to the language of praise.\" See Joh 2:20 , 21, 23-25; 4:1 , 2; 7:37-39; 11: 12, 13 , 49-52; 21:18, 19, 22, 23. The other peculiarity of this Gospel is its supplementary character. By this, in the present instance, we mean something more than the studiousness with which he omits many most important particulars in our Lord's history, for no conceivable reason but that they were already familiar as household words to all his readers, through the three preceding Gospels, and his substituting in place of these an immense quantity of the richest matter not found in the other Gospels. We refer here more particularly to the nature of the additions which distinguish this Gospel; particularly the notices of the different Passovers which occurred during our Lord's public ministry, and the record of His teaching at Jerusalem, without which it is not too much to say that we could have had but a most imperfect conception either of the duration of His ministry or of the plan of it. But another feature of these additions is quite as noticeable and not less important. \"We find,\" to use again the words of Da Costa [Four Witnesses, pp. 238, 239], slightly abridged, \"only six of our Lord's miracles recorded in this Gospel, but these are all of the most remarkable kind, and surpass the rest in depth, specialty of application, and fulness of meaning. Of these six we find only one in the other three Gospels — the multiplication of the loaves. That miracle chiefly, it would seem, on account of the important instructions of which it furnished the occasion ( Joh 6:1-71 ), is here recorded anew. The five other tokens of divine power are distinguished from among the many recorded in the three other Gospels by their furnishing a still higher display of power and command over the ordinary laws and course of nature. Thus we find recorded here the first of all the miracles that Jesus wrought — the changing of water into wine ( Joh 2:1-11 ), the cure of the nobleman's son at a distance ( Joh 4:43-54 ); of the numerous cures of the lame and the paralytic by the word of Jesus, only one — of the man impotent for thirty and eight years ( Joh 5:1-9 ); of the many cures of the blind, one only — of the man born blind ( Joh 9:1-12 ); the restoration of Lazarus, not from a deathbed, like Jairus' daughter, nor from a bier, like the widow of Nain's son, but from the grave, and after lying there four days, and there sinking into corruption ( Joh 11:1-44 ); and lastly, after His resurrection, the miraculous draught of fishes on the Sea of Tiberias ( Joh 21:5-11 ). But these are all recorded chiefly to give occasion for the record of those astonishing discourses and conversations, alike with friends and with foes, with His disciples and with the multitude which they drew forth.\" Other illustrations of the peculiarities of this Gospel will occur, and other points connected with it be adverted to, in the course of the Commentary. CHAPTER 1 Joh 1:1-14 . The Word Made Flesh. 1. In the beginning — of all time and created existence, for this Word gave it being ( Joh 1:3 , 10 ); therefore, \"before the world was\" ( Joh 17:5 , 24 ); or, from all eternity. was the Word — He who is to God what man's word is to himself, the manifestation or expression of himself to those without him. (See on Joh 1:18 ). On the origin of this most lofty and now for ever consecrated title of Christ, this is not the place to speak. It occurs only in the writings of this seraphic apostle. was with God — having a conscious personal existence distinct from God (as one is from the person he is \"with\"), but inseparable from Him and associated with Him ( Joh 1:18 ; Joh 17:5 ; 1Jo 1:2 ), where \"THE Father\" is used in the same sense as \"God\" here. was God — in substance and essence God; or was possessed of essential or proper divinity. Thus, each of these brief but pregnant statements is the complement of the other, correcting any misapprehensions which the others might occasion. Was the Word eternal? It was not the eternity of \"the Father,\" but of a conscious personal existence distinct from Him and associated with Him. Was the Word thus \"with God?\" It was not the distinctness and the fellowship of another being, as if there were more Gods than one, but of One who was Himself God — in such sense that the absolute unity of the God head, the great principle of all religion, is only transferred from the region of shadowy abstraction to the region of essential life and love. But why all this definition? Not to give us any abstract information about certain mysterious distinctions in the Godhead, but solely to let the reader know who it was that in the fulness of time \"was made flesh.\" After each verse, then, the reader must say, \"It was He who is thus, and thus, and thus described, who was made flesh.\"","8493b69b39":"The darkness of error and sin overpowered and quite eclipsed this light. God spoke once, yea twice, but man perceived it not, Job xxxiii. 14 . [2.] The Jews, who had the light of the Old Testament, yet comprehended not Christ in it. As there was a veil upon Moses's face, so there was upon the people's hearts. In the darkness of the types and shadows the light shone; but such as the darkness of their understandings that they could not see it. It was therefore requisite that Christ should come, both to rectify the errors of the Gentile world and to improve the truths of the Jewish church.","467ca6f5f3":"The same, &c. — See what property of the Word the stress is laid upon — His eternal distinctness, in unity, from God — the Father ( Joh 1:2 ).","42fe8befe3":"All things, &c. — all things absolutely (as is evident from Joh 1:10 ; 1Co 8:6 ; Col 1:16 , 17 ; but put beyond question by what follows). without Him was not any thing — not one thing. made — brought into being. that was made — This is a denial of the eternity and non-creation of matter, which was held by the whole thinking world outside of Judaism and Christianity: or rather, its proper creation was never so much as dreamt of save by the children of revealed religion.","07c5bdca1a":"In Him was life — essentially and originally, as the previous verses show to be the meaning. Thus He is the Living Word, or, as He is called in 1Jo 1:1 , 2 , \"the Word of Life.\" the life ... the light of men — All that in men which is true light — knowledge, integrity, intelligent, willing subjection to God, love to Him and to their fellow creatures, wisdom, purity, holy joy, rational happiness — all this \"light of men\" has its fountain in the essential original \"life\" of \"the Word\" ( 1Jo 1:5-7 ; Psa 36:9 ).","97cb91cf6d":"shineth in darkness, &c. — in this dark, fallen world, or in mankind \"sitting in darkness and the shadow of death,\" with no ability to find the way either of truth or of holiness. In this thick darkness, and consequent intellectual and moral obliquity, \"the light of the Word\" shineth — by all the rays whether of natural or revealed teaching which men (apart from the Incarnation of the Word) are favored with. the darkness comprehended it not — did not take it in, a brief summary of the effect of all the strivings of this unincarnate Word throughout this wide world from the beginning, and a hint of the necessity of His putting on flesh, if any recovery of men was to be effected ( 1Co 1:21 ).","3fbbc8ae2c":"6-9. The Evangelist here approaches his grand thesis, so paving his way for the full statement of it in Joh 1:14 , that we may be able to bear the bright light of it, and take in its length and breadth and depth and height.","6e8b1e2997":"God's calling him his beloved Son, in whom he was well pleased, intimated that he was the only begotten of the Father; but the full proof of this was at his resurrection. [4.] What advantage those he dwelt among had from this. He dwelt among them, full of grace and truth. In the old tabernacle wherein God dwelt was the law, in this was grace; in that were types, in this was truth. The incarnate Word was every way qualified for his undertaking as Mediator; for he was full of grace and truth, the two great things that fallen man stands in need of; and this proved him to be the Son of God as much as the divine power and majesty that appeared in him. First, He has a fulness of grace and truth for himself; he had the Spirit without measure. He was full of grace, fully acceptable to his Father, and therefore qualified to intercede for us; and full of truth, fully apprized of the things he was to reveal, and therefore fit to instruct us. He had a fulness of knowledge and a fulness of compassion. Secondly, He has a fulness of grace and truth for us. He received, that he might give, and God was well pleased in him, that he might be well pleased with us in him; and this was the truth of the legal types.","96e3b904a5":"10-13. He was in the world, &c. — The language here is nearly as wonderful as the thought. Observe its compact simplicity, its sonorousness — \"the world\" resounding in each of its three members — and the enigmatic form in which it is couched, startling the reader and setting his ingenuity a-working to solve the stupendous enigma of Christ ignored in His own world. \"The world,\" in the first two clauses, plainly means the created world, into which He came, says Joh 1:9 ; \"in it He was,\" says this verse. By His Incarnation, He became an inhabitant of it, and bound up with it. Yet it \"was made by Him\" ( Joh 1:3-5 ). Here, then, it is merely alluded to, in contrast partly with His being in it, but still more with the reception He met with from it. \"The world that knew Him not\" ( 1Jo 3:1 ) is of course the intelligent world of mankind. (See on Joh 1:11 , 12 ). Taking the first two clauses as one statement, we try to apprehend it by thinking of the infant Christ conceived in the womb and born in the arms of His own creature, and of the Man Christ Jesus breathing His own air, treading His own ground, supported by substances to which He Himself gave being, and the Creator of the very men whom He came to save. But the most vivid commentary on this entire verse will be got by tracing (in His matchless history) Him of whom it speaks walking amidst all the elements of nature, the diseases of men and death itself, the secrets of the human heart, and \"the rulers of the darkness of this world\" in all their number, subtlety, and malignity, not only with absolute ease, as their conscious Lord, but, as we might say, with full consciousness on their part of the presence of their Maker, whose will to one and all of them was law. And this is He of whom it is added, \"the world knew Him not!\"","5475537d6e":"And the Word, &c. — To raise the reader to the altitude of this climax were the thirteen foregoing verses written. was made flesh — BECAME MAN, in man's present frail, mortal condition, denoted by the word \"flesh\" ( Is 40:6 ; 1Pe 1:24 ). It is directed probably against the Docetæ, who held that Christ was not really but only apparently man; against whom this gentle spirit is vehement in his Epistles ( 1Jo 4:3 ; 2Jo 7, 10, 11), [Lucke, &c.]. Nor could He be too much so, for with the verity of the Incarnation all substantial Christianity vanishes. But now, married to our nature, henceforth He is as personally conscious of all that is strictly human as of all that is properly divine; and our nature is in His Person redeemed and quickened, ennobled and transfigured. and dwelt — tabernacled or pitched his tent; a word peculiar to John, who uses it four times, all in the sense of a permanent stay ( Re 7:15 ; 12:12 ; 13:6 ; 21:3 ). For ever wedded to our \"flesh,\" He has entered this tabernacle to \"go no more out.\" The allusion is to that tabernacle where dwelt the Shekinah (see on Mt 23:38 , 39 ), or manifested \"Glory of the Lord,\" and with reference to God's permanent dwelling among His people ( Le 26:11 ; Psa 68:18 ; 132:13 , 14 ; Eze 37:27 ). This is put almost beyond doubt by what immediately follows, \"And we beheld his glory\" [Lucke, Meyer, De Wette which last critic, rising higher than usual, says that thus were perfected all former partial manifestations of God in an essentially Personal and historically Human manifestation]. full of grace and truth — So it should read: \"He dwelt among us full of grace and truth\"; or, in Old Testament phrase, \"Mercy and truth,\" denoting the whole fruit of God's purposes of love towards sinners of mankind, which until now existed only in promise, and the fulfilment at length of that promise in Christ; in one great word, \"the SURE MERCIES of David\" ( Is 55:3 ; Ac 13:34 ; compare 2Sa 23:5 ). In His Person all that Grace and Truth which had been floating so long in shadowy forms, and darting into the souls of the poor and needy its broken beams, took everlasting possession of human flesh and filled it full. By this Incarnation of Grace and Truth, the teaching of thousands of years was at once transcended and beggared, and the family of God sprang into Manhood. and we beheld his glory — not by the eye of sense, which saw in Him only \"the carpenter.\" His glory was \"spiritually discerned\" ( 1Co 2:7-15 ; 2Co 3:18 ; 4:4 , 6 ; 5:16 ) — the glory of surpassing grace, love, tenderness, wisdom, purity, spirituality; majesty and meekness, richness and poverty, power and weakness, meeting together in unique contrast; ever attracting and at times ravishing the \"babes\" that followed and forsook all for Him. the glory as of the only begotten of the Father — (See on Lu 1:35 ); not like, but \"such as (belongs to),\" such as became or was befitting the only begotten of the Father [Chrysostom in Lucke, Calvin, &c.], according to a well-known use of the word \"as.\"","13f2605894":"Joh 1:15 . A Saying of the Baptist Confirmatory of This. 15. after me — in official manifestation. before me — in rank and dignity. for he was before me — in existence; \"His goings forth being from of old, from everlasting\" ( Mi 5:2 ). (Anything lower than this His words cannot mean); that is, \"My Successor is my Superior, for He was my Predecessor.\" This enigmatic play upon the different senses of the words \"before\" and \"after\" was doubtless employed by the Baptist to arrest attention, and rivet the thought; and the Evangelist introduces it just to clinch his own statements.","d3b967e8b3":"We have therefore need to live by faith, by which we see him that is invisible, Heb. xi. 27 . [2.] That the revelation which God made of himself in the Old Testament was very short and imperfect, in comparison with that which he has made by Christ: No man hath seen God at any time; that is, what was seen and known of God before the incarnation of Christ was nothing to that which is now seen and known; life and immortality are now brought to a much clearer light than they were then. [3.] That none of the Old-Testament prophets were so well qualified to make known the mind and will of God to the children of men as our Lord Jesus was, for none of them had seen God at any time. Moses beheld the similitude of the Lord ( Num. xii. 8 ), but was told that he could not see his face, Exod. xxxiii. 20 . But this recommends Christ's holy religion to us that it was founded by one that had seen God, and knew more of his mind than any one else ever did. (2.) The all-sufficiency of the gospel discovery proved from its author: The only-begotten Son, who is in the bosom of the Father, he has declared him. Observe here, [1.] How fit he was to make this discovery, and every way qualified for it. He and he alone was worthy to take the book, and to open the seals, Rev. v. 9 . For, First, He is the only-begotten Son; and who so likely to know the Father as the Son? or in whom is the Father better known than in the Son? Matt. xi. 27 . He is of the same nature with the Father, so that he who hath seen him hath seen the Father, ch. xiv. 9 . The servant is not supposed to know so well what his Lord does as the Son, ch. xv. 15 . Moses was faithful as a servant, but Christ as a Son. Secondly, He is in the bosom of the Father. He had lain in his bosom from eternity. When he was here upon earth, yet still, as God, he was in the bosom of the Father, and thither he returned when he ascended. In the bosom of the Father; that is, 1. In the bosom of his special love, dear to him, in whom he was well pleased, always his delight. All God's saints are in his hand, but his Son was in his bosom, one in nature and essence, and therefore in the highest degree one in love. 2. In the bosom of his secret counsels. As there was a mutual complacency, so there was a mutual consciousness, between the Father and Son ( Matt. xi. 27 ); none so fit as he to make known God, for none knew his mind as he did. Our most secret counsels we are said to hide in our bosom (in pectore ); Christ was privy to the bosom-counsels of the Father. The prophets sat down at his feet as scholars; Christ lay in his bosom as a friend. See Eph. iii. 11 . [2.] How free he was in making this discovery: He hath declared. Him is not in the original. He has declared that of God which no man had at any time seen or known; not only that which was hid of God, but that which was hid in God ( Eph. iii. 9 ), exegesato —it signifies a plain, clear, and full discovery, not by general and doubtful hints, but by particular explications. He that runs may now read the will of God and the way of salvation. This is the grace, this the truth, that came by Jesus Christ.","23688aa4da":"Joh 1:16-18 . Same Subject Continued. 16. of his fulness — of \"grace and truth,\" resuming the thread of Joh 1:14 . grace for grace — that is, grace upon grace (so all the best interpreters), in successive communications and larger measures, as each was able to take it in. Observe, the word \"truth\" is here dropped. \"Grace\" being the chosen New Testament word for the whole fulness of the new covenant, all that dwells in Christ for men.","18b0613e24":"For, &c. — The Law elicits the consciousness of sin and the need of redemption; it only typifies the reality. The Gospel, on the contrary, actually communicates reality and power from above (compare Ro 6:14 ). Hence Paul terms the Old Testament \"shadow,\" while he calls the New Testament \"substance\" ( Col 2:17 ) [Olshausen].","9d43d68c60":"No man — \"No one,\" in the widest sense. hath seen God — by immediate gaze, or direct intuition. in the bosom of the Father — A remarkable expression, used only here, presupposing the Son's conscious existence distinct from the Father, and expressing His immediate and most endeared access to, and absolute acquaintance with, Him. he — emphatic; As if he should say, \"He and He only hath declared Him,\" because He only can.","7b94174ca3":"26-27. Likewise the Spirit also, &c. — or, \"But after the like manner doth the Spirit also help. our infirmities — rather (according to the true reading), \"our infirmity\"; not merely the one infirmity here specified, but the general weakness of the spiritual life in its present state, of which one example is here given. for we know not what we should pray for as we ought — It is not the proper matter of prayer that believers are at so much loss about, for the fullest directions are given them on this head: but to ask for the right things \"as they ought\" is the difficulty. This arises partly from the dimness of our spiritual vision in the present veiled state, while we have to \"walk by faith, not by sight\" (see on 1Co 13:9 and 2Co 5:7 ), and the large admixture of the ideas and feelings which spring from the fleeting objects of sense that there is in the very best views and affections of our renewed nature; partly also from the necessary imperfection of all human language as a vehicle for expressing the subtle spiritual feelings of the heart. In these circumstances, how can it be but that much uncertainty should surround all our spiritual exercises, and that in our nearest approaches and in the freest outpourings of our hearts to our Father in heaven, doubts should spring up within us whether our frame of mind in such exercises is altogether befitting and well pleasing to God? Nor do these anxieties subside, but rather deepen, with the depth and ripeness of our spiritual experience. but the Spirit itself — rather, \"Himself.\" (See end of Ro 8:27 ). maketh intercession for us with groanings which cannot be uttered — that is, which cannot be expressed in articulate language. Sublime and affecting ideas, for which we are indebted to this passage alone! \"As we struggle to express in articulate language the desires of our hearts and find that our deepest emotions are the most inexpressible, we 'groan' under this felt inability. But not in vain are these groanings. For 'the Spirit Himself' is in them, giving to the emotions which He Himself has kindled the only language of which they are capable; so that though on our part they are the fruit of impotence to utter what we feel, they are at the same time the intercession of the Spirit Himself in our behalf.\"","4e92d20282":"But all the providences of God are theirs—merciful providences, afflicting providences, personal, public. They are all for good; perhaps for temporal good, as Joseph's troubles; at least, for spiritual and eternal good. That is good for them which does their souls good. Either directly or indirectly, every providence has a tendency to the spiritual good of those that love God, breaking them off from sin, bringing them nearer to God, weaning them from the world, fitting them for heaven. Work together. They work, as physic works upon the body, various ways, according to the intention of the physician; but all for the patient's good. They work together, as several ingredients in a medicine concur to answer the intention. God hath set the one over against the other ( Eccl. vii. 14 ): synergei, a very singular, with a noun plural, denoting the harmony of Providence and its uniform designs, all the wheels as one wheel, Ezek. x. 13 . He worketh all things together for good; so some read it. It is not from any specific quality in the providences themselves, but from the power and grace of God working in, with, and by, these providences. All this we know —know it for a certainty, from the word of God, from our own experience, and from the experience of all the saints.","cacde927fb":"And — or, \"Moreover,\" or \"Now\"; noting a transition to a new particular. we know, &c. — The order in the original is more striking: \"We know that to them that love God\" (compare 1Co 2:9 ; Ep 6:24 ; Jas 1:12 ; 2:5) \"all things work together for good [even] to them who are the called (rather, 'who are called') according to His (eternal) purpose.\" Glorious assurance! And this, it seems, was a \"household word,\" a \"known\" thing, among believers. This working of all things for good is done quite naturally to \"them that love God,\" because such souls, persuaded that He who gave His own Son for them cannot but mean them well in all His procedure, learn thus to take in good part whatever He sends them, however trying to flesh and blood: and to them who are the called, according to \"His purpose,\" all things do in the same intelligible way \"work together for good\"; for, even when \"He hath His way in the whirlwind,\" they see \"His chariot paved with love\" ( So 3:10 ). And knowing that it is in pursuance of an eternal \"purpose\" of love that they have been \"called into the fellowship of His Son Jesus Christ\" ( 1Co 1:9 ), they naturally say within themselves, \"It cannot be that He 'of whom, and through whom, and to whom are all things,' should suffer that purpose to be thwarted by anything really adverse to us, or that He should not make all things, dark as well as light, crooked as well as straight, to co-operate to the furtherance and final completion of His high design.\"","3d15924a3d":"For — as touching this \"calling according to his purpose\" ( Ro 8:28 ). whom he did foreknow he also did predestinate — foreordain. In what sense are we to take the word \"foreknow\" here? \"Those who He foreknew would repent and believe,\" say Pelagians of every age and every hue. But this is to thrust into the text what is contrary to the whole spirit, and even letter, of the apostle's teaching (see Ro 9:11 ; 2Ti 1:9 ). In Ro 11:2 , and Psa 1:6 , God's \"knowledge\" of His people cannot be restricted to a mere foresight of future events, or acquaintance with what is passing here below. Does \"whom He did foreknow,\" then, mean \"whom He foreordained?\" Scarcely, because both \"foreknowledge\" and \"foreordination\" are here mentioned, and the one as the cause of the other. It is difficult indeed for our limited minds to distinguish them as states of the Divine Mind towards men; especially since in Ac 2:23 \"the counsel\" is put before \"the foreknowledge of God,\" while in 1Pe 1:2 \"election\" is said to be \"according to the foreknowledge of God.\" But probably God's foreknowledge of His own people means His \"peculiar, gracious, complacency in them,\" while His \"predestinating\" or \"foreordaining\" them signifies His fixed purpose, flowing from this, to \"save them and call them with an holy calling\" ( 2Ti 1:9 ). to be conformed to the image of his Son — that is, to be His sons after the pattern, model, or image of His Sonship in our nature. that he might be the first-born among many brethren — \"The First-born,\" the Son by nature; His \"many brethren,\" sons by adoption: He, in the Humanity of the Only-begotten of the Father, bearing our sins on the accursed tree; they in that of mere men ready to perish by reason of sin, but redeemed by His blood from condemnation and wrath, and transformed into His likeness: He \"the First-born from the dead\"; they \"that sleep in Jesus,\" to be in due time \"brought with Him\"; \"The First-born,\" now \"crowned with glory and honor\"; His \"many brethren,\" \"when He shall appear, to be like Him, for they shall see Him as He is.\"","7f57ee7898":"III. Whom he called those he also justified. All that are effectually called are justified, absolved from guilt, and accepted as righteous through Jesus Christ. They are recti in curia—right in court; no sin that ever they have been guilty of shall come against them, to condemn them. The book is crossed, the bond cancelled, the judgment vacated, the attainder reversed; and they are no longer dealt with as criminals, but owned and loved as friends and favourites. Blessed is the man whose iniquity is thus forgiven. None are thus justified but those that are effectually called. Those that stand it out against the gospel call abide under guilt and wrath. IV. Whom he justified those he also glorified. The power of corruption being broken in effectual calling, and the guilt of sin removed in justification, all that which hinders is taken out of the way, and nothing can come between that soul and glory. Observe, It is spoken of as a thing done: He glorified, because of the certainty of it; he hath saved us, and called us with a holy calling. In the eternal glorification of all the elect, God's design of love has its full accomplishment. This was what he aimed at all along—to bring them to heaven. Nothing less than that glory would make up the fulness of his covenant relation to them as God; and therefore, in all he does for them, and in them, he has this in his eye. Are they chosen? It is to salvation. Called? It is to his kingdom and glory. Begotten again? It is to an inheritance incorruptible. Afflicted: It is to work for them this exceeding and eternal weight of glory. Observe, The author of all these is the same. It is God himself that predestinated, calleth, justifieth, glorifieth; so the Lord alone did lead him, and there was no strange God with him. Created wills are so very fickle, and created powers so very feeble, that, if any of these did depend upon the creature, the whole would shake. But God himself hath undertaken the doing of it from first to last, that we might abide in a constant dependence upon him and subjection to him, and ascribe all the praise to him—that every crown may be cast before the throne. This is a mighty encouragement to our faith and hope; for, as for God, his way, his work, is perfect. He that hath laid the foundation will build upon it, and the top-stone will at length be brought forth with shoutings, and it will be our eternal work to cry, Grace, grace to it.","32302ab3c7":"Moreover — \"And,\" or \"Now\"; explanatory of Ro 8:29 — In \"predestinating us to be conformed to the image of His Son\" in final glory, He settled all the successive steps of it. Thus whom he did predestinate, them he also called — The word \"called\" (as Hodge and others truly observe) is never in the Epistles of the New Testament applied to those who have only the outward invitation of the Gospel (as in Mt 20:16 ; 22:14 ). It always means \"internally, effectually, savingly called.\" It denotes the first great step in personal salvation and answers to \"conversion.\" Only the word conversion expresses the change of character which then takes place, whereas this \"calling\" expresses the divine authorship of the change, and the sovereign power by which we are summoned, Matthew-like, Zaccheus-like, out of our old, wretched, perishing condition, into a new, safe, blessed life. and whom he called — thus. them he also justified — brought into the definite state of reconciliation already so fully described. and whom he justified, them he also glorified — brought to final glory ( Ro 8:17 , 18 ). Noble climax, and so rhythmically expressed! And all this is viewed as past; because, starting from the past decree of \"predestination to be conformed to the image of God's Son\" of which the other steps are but the successive unfoldings — all is beheld as one entire, eternally completed salvation.","5de25ac227":"What shall we then say to these things? — \"We can no farther go, think, wish\" [Bengel]. This whole passage, to Ro 8:34 , and even to the end of the chapter, strikes all thoughtful interpreters and readers, as transcending almost every thing in language, while Olshausen notices the \"profound and colossal\" character of the thought. If God be for us, who can be against us? — If God be resolved and engaged to bring us through, all our enemies must be His; and \"Who would set the briers and thorns against Him in battle? He would go through them. He would burn them together\" ( Is 27:4 ). What strong consolation is here! Nay, but the great Pledge of all has already been given; for,","bffc01a9fd":"There is one more than a conqueror, when pressed above measure. He that embraced the stake, and said, \"Welcome the cross of Christ, welcome everlasting life,\"—he that dated his letter from the delectable orchard of the Leonine prison,—he that said, \"In these flames I feel no more pain than if I were upon a bed of down,\"—she who, a little before her martyrdom, being asked how she did, said, \"Well and merry, and going to heaven,\"—those that have gone smiling to the stake, and stood singing in the flames—these were more than conquerors. [3.] It is only through Christ that loved us, the merit of his death taking the sting out of all these troubles, the Spirit of his grace strengthening us, and enabling us to bear them with holy courage and constancy, and coming in with special comforts and supports. Thus we are conquerors, not in our own strength, but in the grace that is in Christ Jesus. We are conquerors by virtue of our interest in Christ's victory. He hath overcome the world for us ( John xvi. 33 ), both the good things and the evil things of it; so that we have nothing to do but to pursue the victory, and to divide the spoil, and so are more than conquerors. 2. A direct and positive conclusion of the whole matter: For I am persuaded, v. 38, 39 . It denotes a full, and strong, and affectionate persuasion, arising from the experience of the strength and sweetness of the divine love. And here he enumerates all those things which might be supposed likely to separate between Christ and believers, and concludes that it could not be done. (1.) Neither death nor life —neither the terrors of death on the one hand nor the comforts and pleasures of life on the other, neither the fear of death nor the hope of life. Or, We shall not be separated from that love either in death or in life. (2.) Nor angels, nor principalities, nor powers. Both the good angels and the bad are called principalities and powers: the good, Eph. i. 21 ; Col. i. 16 ; the bad, Eph. vi. 12 ; Col. ii. 15 . And neither shall do it. The good angels will not, the bad shall not; and neither can. The good angels are engaged friends, the bad are restrained enemies. (3.) Nor things present, nor things to come —neither the sense of troubles present nor the fear of troubles to come. Time shall not separate us, eternity shall not. Things present separate us from things to come, and things to come separate and cut us off from things present; but neither from the love of Christ, whose favour is twisted in with both present things and things to come. (4.) Nor height, nor depth —neither the height of prosperity and preferment, nor the depth of adversity and disgrace; nothing from heaven above, no storms, no tempests; nothing on earth below, no rocks, no seas, no dungeons. (5.) Nor any other creature —any thing that can be named or thought of. It will not, it cannot, separate us from the love of God, which is in Christ Jesus our Lord. It cannot cut off or impair our love to God, or God's to us; nothing does it, can do it, but sin. Observe, The love that exists between God and true believers is through Christ. He is the Mediator of our love: it is in and through him that God can love us and that we dare love God. This is the ground of the stedfastness of the love; therefore God rests in his love ( Zeph. iii. 17 ), because Jesus Christ, in whom he loves us, is the same yesterday, to-day, and for ever. Mr. Hugh Kennedy, an eminent Christian of Ayr, in Scotland, when he was dying, called for a Bible; but, finding his sight gone, he said, \"Turn me to the eighty of the Romans, and set my finger at these words, I am persuaded that neither death nor life, \" &c. \"Now,\" said he, \"is my finger upon them?\" And, when they told him it was, without speaking any more, he said, \"Now, God be with you, my children; I have breakfasted with you, and shall sup with my Lord Jesus Christ this night;\" and so departed.","0c00909e96":"He — rather, \"He surely.\" (It is a pity to lose the emphatic particle of the original). that spared not — \"withheld not,\" \"kept not back.\" This expressive phrase, as well as the whole thought, is suggested by Ge 22:12 , where Jehovah's touching commendation of Abraham's conduct regarding his son Isaac seems designed to furnish something like a glimpse into the spirit of His own act in surrendering His own Son. \"Take now (said the Lord to Abraham) thy son, thine only, whom thou lovest, and ... offer him for a burnt offering\" ( Ge 22:2 ); and only when Abraham had all but performed that loftiest act of self-sacrifice, the Lord interposed, saying, \"Now I know that thou fearest God, seeing thou HAST NOT WITHHELD THY SON, THINE ONLY SON, from Me.\" In the light of this incident, then, and of this language, our apostle can mean to convey nothing less than this, that in \"not sparing His own Son, but delivering Him up,\" or surrendering Him, God exercised, in His Paternal character, a mysterious act of Self-sacrifice, which, though involving none of the pain and none of the loss which are inseparable from the very idea of self-sacrifice on our part, was not less real, but, on the contrary, as far transcended any such acts of ours as His nature is above the creature's. But this is inconceivable if Christ be not God's \"own (or proper) Son,\" partaker of His very nature, as really as Isaac was of his father Abraham's. In that sense, certainly, the Jews charged our Lord with making Himself \"equal with God\" (see on Joh 5:18 ), which He in reply forthwith proceeded, not to disown, but to illustrate and confirm. Understand Christ's Sonship thus, and the language of Scripture regarding it is intelligible and harmonious; but take it to be an artificial relationship, ascribed to Him in virtue either of His miraculous birth, or His resurrection from the dead, or the grandeur of His works, or all of these together — and the passages which speak of it neither explain of themselves nor harmonize with each other. delivered him up — not to death merely (as many take it), for that is too narrow an idea here, but \"surrendered Him\" in the most comprehensive sense; compare Joh 3:16 , \"God so loved the world that He GAVE His only-begotten Son.\" for us all — that is, for all believers alike; as nearly every good interpreter admits must be the meaning here. how shall he not — how can we conceive that He should not. with him also — rather, \"also with Him.\" (The word \"also\" is often so placed in our version as to obscure the sense; see on He 12:1 ). freely give us all things? — all other gifts being not only immeasurably less than this Gift of gifts, but virtually included in it.","007b884cd6":"33-34. Who shall lay anything to the charge of — or, \"bring any charge against.\" God's elect? — the first place in this Epistle where believers are styled \"the elect.\" In what sense this is meant will appear in next chapter.","019efa6056":"35-36. Who shall separate us from the love of Christ? — This does not mean \"our love to Christ,\" as if, Who shall hinder us from loving Christ? but \"Christ's love to us,\" as is clear from the closing words of the chapter, which refer to the same subject. Nor would the other sense harmonize with the scope of the chapter, which is to exhibit the ample ground of the believer's confidence in Christ. \"It is no ground of confidence to assert, or even to feel, that we will never forsake Christ; but it is the strongest ground of assurance to be convinced that His love will never change\" [Hodge]. shall tribulation, &c. — \"None of these, nor all together, how terrible soever to the flesh, are tokens of God's wrath, or the least ground for doubt of His love. From whom could such a question come better than from one who had himself for Christ's sake endured so much? (See 2Co 11:11-33 ; 1Co 4:10-13 ). The apostle says not (remarks Calvin nobly) \"What,\" but \"Who,\" just as if all creatures and all afflictions were so many gladiators taking arms against the Christians [Tholuck].","2cec0732cd":"Nay, in all these things we are more than conquerors, through him that loved us — not, \"We are so far from being conquered by them, that they do us much good\" [Hodge]; for though this be true, the word means simply, \"We are pre-eminently conquerors.\" See on Ro 5:20 . And so far are they from \"separating us from Christ's love,\" that it is just \"through Him that loved us\" that we are victorious over them.","64faa552de":"38-39. For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers — whether good or bad. But as the bad are not called \"angels,\" or \"principalities,\" or \"powers,\" save with some addition to show that such are meant ( Mt 25:41 ; Col 2:15 ; Ep 6:12 ; 2Pe 2:4 — except perhaps 1Co 6:3 ), probably the good are meant here, but merely as the same apostle supposes an angel from heaven to preach a false gospel. (So the best interpreters). nor things present, nor things to come — no condition of the present life and none of the unknown possibilities of the life to come."},"i":{"Psalm 23:1":{"jfb":"0bcd7a2bd0","mhc":"256cf7de47"},"Psalm 23:2":{"jfb":"11117ae27d","mhc":"256cf7de47"},"Psalm 23:3":{"jfb":"494a899294","mhc":"256cf7de47"},"Psalm 23:4":{"jfb":"7fe4b17eaf","mhc":"256cf7de47"},"Psalm 23:5":{"jfb":"bfae226c12","mhc":"256cf7de47"},"Psalm 23:6":{"jfb":"bfae226c12","mhc":"256cf7de47"},"John 1:1":{"jfb":"287d1f6864","mhc":"8493b69b39"},"John 1:2":{"jfb":"467ca6f5f3","mhc":"8493b69b39"},"John 1:3":{"jfb":"42fe8befe3","mhc":"8493b69b39"},"John 1:4":{"jfb":"07c5bdca1a","mhc":"8493b69b39"},"John 1:5":{"jfb":"97cb91cf6d","mhc":"8493b69b39"},"John 1:6":{"jfb":"3fbbc8ae2c","mhc":"6e8b1e2997"},"John 1:7":{"jfb":"3fbbc8ae2c","mhc":"6e8b1e2997"},"John 1:8":{"jfb":"3fbbc8ae2c","mhc":"6e8b1e2997"},"John 1:9":{"jfb":"3fbbc8ae2c","mhc":"6e8b1e2997"},"John 1:10":{"jfb":"96e3b904a5","mhc":"6e8b1e2997"},"John 1:11":{"jfb":"96e3b904a5","mhc":"6e8b1e2997"},"John 1:12":{"jfb":"96e3b904a5","mhc":"6e8b1e2997"},"John 1:13":{"jfb":"96e3b904a5","mhc":"6e8b1e2997"},"John 1:14":{"jfb":"5475537d6e","mhc":"6e8b1e2997"},"John 1:15":{"jfb":"13f2605894","mhc":"d3b967e8b3"},"John 1:16":{"jfb":"23688aa4da","mhc":"d3b967e8b3"},"John 1:17":{"jfb":"18b0613e24","mhc":"d3b967e8b3"},"John 1:18":{"jfb":"9d43d68c60","mhc":"d3b967e8b3"},"Romans 8:26":{"jfb":"7b94174ca3","mhc":"4e92d20282"},"Romans 8:27":{"jfb":"7b94174ca3","mhc":"4e92d20282"},"Romans 8:28":{"jfb":"cacde927fb","mhc":"4e92d20282"},"Romans 8:29":{"jfb":"3d15924a3d","mhc":"7f57ee7898"},"Romans 8:30":{"jfb":"32302ab3c7","mhc":"7f57ee7898"},"Romans 8:31":{"jfb":"5de25ac227","mhc":"bffc01a9fd"},"Romans 8:32":{"jfb":"0c00909e96","mhc":"bffc01a9fd"},"Romans 8:33":{"jfb":"007b884cd6","mhc":"bffc01a9fd"},"Romans 8:34":{"jfb":"007b884cd6","mhc":"bffc01a9fd"},"Romans 8:35":{"jfb":"019efa6056","mhc":"bffc01a9fd"},"Romans 8:36":{"jfb":"019efa6056","mhc":"bffc01a9fd"},"Romans 8:37":{"jfb":"2cec0732cd","mhc":"bffc01a9fd"},"Romans 8:38":{"jfb":"64faa552de","mhc":"bffc01a9fd"},"Romans 8:39":{"jfb":"64faa552de","mhc":"bffc01a9fd"}}};
const $ = s => document.querySelector(s);

/* marks: one entry per highlighted range.
   {id, chapter, a:{vi,wi}, b:{vi,wi}, color, note, text, refs} */
let marks = [];
try { marks = JSON.parse(localStorage.getItem("lamp-marks") || "[]"); } catch (e) {}
const saveMarks = () => { try { localStorage.setItem("lamp-marks", JSON.stringify(marks)); } catch (e) {} };
let anchor = null, head = null, dragging = false, activeMark = null;

const key = (vi, wi) => vi * 1000 + wi;
const ordered = () => {
  if (!anchor || !head) return null;
  const a = key(anchor.vi, anchor.wi), b = key(head.vi, head.wi);
  return a <= b ? { a: anchor, b: head } : { a: head, b: anchor };
};
function inRange(vi, wi, r) {
  if (!r) return false;
  const k = key(vi, wi);
  return k >= key(r.a.vi, r.a.wi) && k <= key(r.b.vi, r.b.wi);
}
function markAt(vi, wi) {
  return marks.find(m => m.chapter === chapter && inRange(vi, wi, m));

function rangeText(r) {
  const vs = DATA[chapter], out = [];
  for (let vi = r.a.vi; vi <= r.b.vi; vi++) {
    const ws = vs[vi].words;
    const lo = vi === r.a.vi ? r.a.wi : 0;
    const hi = vi === r.b.vi ? r.b.wi : ws.length - 1;
    for (let wi = lo; wi <= hi; wi++) {
      const w = ws[wi]; if (!w) continue;
      if (w.text === "-") { if (w.pnc || w.endQ) out.push((w.pnc || "") + (w.endQ || "")); continue; }
      out.push((w.begQ || "") + w.text + (w.pnc || "") + (w.endQ || ""));

  return out.join(" ").replace(/\s+([,.;:!?\u2019'"])/g, "$1").trim();
}
function rangeRefs(r) {

}

function render() {

  col.innerHTML = "";
  vs.forEach((v, vi) => {
    if (v.heading) { const h = document.createElement("h2"); h.className = "sec"; h.textContent = v.heading; col.appendChild(h); }
    const n = v.ref.split(":")[1];
    if (v.psalm_title && vi === 0) {

    p.appendChild(sup);
    const skip = (v.psalm_title && vi === 0) ? 2 : 0;
    v.words.forEach((w, wi) => {
      if (wi < skip) return;
      if (w.text === "-") {
        const trail = (w.pnc || "") + (w.endQ || "");
        if (trail) {
          const prev = p.lastChild;
          if (prev && prev.nodeType === 3 && prev.textContent === " ") prev.textContent = trail + " ";
          else p.appendChild(document.createTextNode(trail + " "));
        }
        return;
      }
      const s = document.createElement("span");
      s.className = "w"; s.textContent = w.text; s.dataset.vi = vi; s.dataset.wi = wi;
      const mk = markAt(vi, wi);

      if (inRange(vi, wi, ordered())) s.classList.add("sel-range");
      s.onclick = e => {
        if (e.shiftKey && anchor) { head = { vi, wi }; render(); showToolbar(); return; }
        const m = markAt(vi, wi);
        if (m) { activeMark = m; anchor = head = null; render(); showToolbarFor(m); return; }
        focusWord = w; focusRef = v.ref; tab = "word"; openSheet();
      };
      if (w.begQ) p.appendChild(document.createTextNode(w.begQ));
      p.appendChild(s);
      const trail = (w.pnc || "") + (w.endQ || "");
      if (trail) {
        const t = document.createElement("span");
        t.textContent = trail;
        if (mk) { t.className = "hl-" + mk.color; }
        else if (inRange(vi, wi, ordered())) t.className = "sel-range";
        p.appendChild(t);
      }
      const gap = document.createElement("span");
      gap.textContent = " ";
      const nextMk = markAt(vi, wi + 1);
      if (mk && nextMk && mk.id === nextMk.id) gap.className = "hl-" + mk.color;
      else if (inRange(vi, wi, ordered()) && inRange(vi, wi + 1, ordered())) gap.className = "sel-range";
      p.appendChild(gap);
    });
    if (v.footnotes && v.footnotes.length) {

        p.appendChild(m);

    col.appendChild(p);
  });

      const ta = $("#note"); ta.value = cur.note || "";
      ta.oninput = () => { cur.note = ta.value; saveMarks(); $("#note-state").textContent = "Saved"; render(); };

  $("#play").innerHTML = "&#9654;"; $("#prog").style.width = "0";
  document.querySelectorAll(".w.lit").forEach(e => e.classList.remove("lit"));
  document.querySelectorAll("p.v.reading").forEach(e => e.classList.remove("reading"));
  $("#psub").textContent = "Phonon 31M · on device · ready";
}
function tick() {
  const vs = DATA[chapter];
  document.querySelectorAll(".w.lit").forEach(e => e.classList.remove("lit"));
  if (pv >= vs.length) { stop(); return; }
  const words = vs[pv].words;
  document.querySelectorAll("p.v.reading").forEach(e => e.classList.remove("reading"));
  const p = $("#v" + pv);
  if (p) {
    p.classList.add("reading");
    const el = p.querySelector('[data-wi="' + pw + '"]');
    if (el) {
      el.classList.add("lit");
      const r = el.getBoundingClientRect(), sc = $("#scroll").getBoundingClientRect();
      if (r.bottom > sc.bottom - 90 || r.top < sc.top + 40) el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  const done = vs.slice(0, pv).reduce((a, v) => a + v.words.length, 0) + pw;
  const total = vs.reduce((a, v) => a + v.words.length, 0);
  $("#prog").style.width = (100 * done / total) + "%";
  $("#psub").textContent = vs[pv].ref + " · " + $("#voice").value +
    ($("#bed").value === "None" ? "" : " over " + $("#bed").value.replace("Lo-fi: ", ""));
  pw++;
  if (pw >= words.length) { pw = 0; pv++; }
}
$("#play").onclick = () => {
  if (playing) { stop(); return; }
  playing = true; $("#play").innerHTML = "&#10073;&#10073;";
  const rate = parseFloat($("#rate").value) || 1;
  timer = setInterval(tick, 300 / rate); tick();
};
$("#voice").onchange = () => { if (playing) $("#psub").textContent = "Switched to " + $("#voice").value; };
addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); $("#picker").classList.remove("open"); }
  if (e.key === " " && e.target.tagName !== "TEXTAREA") { e.preventDefault(); $("#play").click(); }
});
/* ---- drag to select a range ---- */
const colEl = $("#col");
colEl.addEventListener("pointerdown", e => {
  const w = e.target.closest(".w");
  if (!w) return;
  if (markAt(+w.dataset.vi, +w.dataset.wi)) return;   // tap an existing mark instead
  dragging = true; activeMark = null;
  anchor = { vi: +w.dataset.vi, wi: +w.dataset.wi };
  head = { ...anchor };
  hideToolbar();
});
colEl.addEventListener("pointermove", e => {
  if (!dragging) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const w = el && el.closest ? el.closest(".w") : null;
  if (!w) return;
  const nh = { vi: +w.dataset.vi, wi: +w.dataset.wi };
  if (!head || nh.vi !== head.vi || nh.wi !== head.wi) { head = nh; render(); }
});
addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = false;
  const r = ordered();
  if (r && (r.a.vi !== r.b.vi || r.a.wi !== r.b.wi)) showToolbar();
  else { anchor = head = null; render(); }
});

function showToolbar() {
  const r = ordered(); if (!r) return;
  const tb = $("#toolbar"); tb.classList.add("open");
  const sel = colEl.querySelectorAll(".sel-range, .hl-gold, .hl-rose, .hl-sage, .hl-sky");
  const first = colEl.querySelector('[data-vi="' + r.a.vi + '"][data-wi="' + r.a.wi + '"]');
  const box = (first || sel[0]).getBoundingClientRect();
  const tw = tb.offsetWidth || 270;
  let left = box.left + box.width / 2 - tw / 2;
  left = Math.max(10, Math.min(left, innerWidth - tw - 10));
  let top = box.top - tb.offsetHeight - 10;
  if (top < 60) top = box.bottom + 10;
  tb.style.left = left + "px"; tb.style.top = top + "px";
  $("#tb-clear").style.display = activeMark ? "" : "none";
}
function hideToolbar() { $("#toolbar").classList.remove("open"); }
function showToolbarFor(m) {
  const tb = $("#toolbar"); tb.classList.add("open");
  const first = colEl.querySelector('[data-vi="' + m.a.vi + '"][data-wi="' + m.a.wi + '"]');
  if (!first) return hideToolbar();
  const box = first.getBoundingClientRect(), tw = tb.offsetWidth || 270;
  let left = Math.max(10, Math.min(box.left + box.width / 2 - tw / 2, innerWidth - tw - 10));
  let top = box.top - tb.offsetHeight - 10;
  if (top < 60) top = box.bottom + 10;
  tb.style.left = left + "px"; tb.style.top = top + "px";
  $("#tb-clear").style.display = "";
}

function commit(color) {
  const r = ordered(); if (!r) return null;
  if (activeMark) { activeMark.color = color; saveMarks(); render(); showToolbar(); return activeMark; }
  const m = { id: Date.now() + "", chapter, a: r.a, b: r.b, color,
              note: "", text: rangeText(r), refs: rangeRefs(r) };
  marks = marks.filter(x => !(x.chapter === chapter && inRange(x.a.vi, x.a.wi, r)));
  marks.push(m); saveMarks(); activeMark = m;
  anchor = head = null;              // selection becomes the mark; drop the overlay
  render(); showToolbarFor(m);
  return m;
}
document.querySelectorAll(".swatch").forEach(b =>
  b.onclick = () => commit(b.dataset.hl));
$("#tb-note").onclick = () => {
  const m = activeMark || commit("gold");
  if (!m) return;
  focusRef = m.refs; tab = "note"; openSheet(); hideToolbar();
};
$("#tb-clear").onclick = () => {
  if (activeMark) { marks = marks.filter(x => x.id !== activeMark.id); saveMarks(); }
  activeMark = null; anchor = head = null; hideToolbar(); render();
};
colEl.addEventListener("pointerdown", e => { if (!e.target.closest(".w")) { anchor = head = null; activeMark = null; hideToolbar(); render(); } });

render();
</script>
</body>
</html>
